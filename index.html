<!DOCTYPE html>
<html>
<head>
  <title>MathQuiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #codeScreen {
      position: absolute;
      inset: 0;
      background: #46178f;
      color: white;
      padding-top: 120px;
      z-index: 10;
    }

    #codeScreen h1 {
      font-size: 55px;
    }

    input {
      padding: 15px;
      width: 250px;
      font-size: 20px;
      text-align: center;
      border: 0;
      border-radius: 8px;
    }

    button {
      padding: 15px 35px;
      margin: 15px;
      font-size: 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #game {
      display: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
      z-index: 5;
    }

    #message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 45px;
      font-weight: bold;
      text-shadow: 3px 3px 5px black;
      display: none;
      z-index: 6;
    }
  </style>
</head>

<body>

<!-- CODE SCREEN -->
<div id="codeScreen">

  <h1>MathQuiz</h1>

  <h2>Enter Game Code</h2>

  <input id="code" placeholder="Game Code">

  <br>

  <button onclick="unlock()">ENTER</button>

  <p id="wrong"></p>

</div>


<!-- GAME -->
<div id="game">

  <div id="hud">
    🏂 Speed: <span id="speed">0</span>
    &nbsp;&nbsp;
    🏁 Distance: <span id="distance">0</span>
  </div>

  <div id="message">
    CRASHED!
    <br>
    <button onclick="restart()">RESTART</button>
  </div>

  <canvas id="canvas"></canvas>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =========================
   GAME VARIABLES
========================= */

let playing = false;

let speed = 0.012;
let distance = 0;

let playerX = 0;

let crashed = false;

let objects = [];

let keys = {};


/* =========================
   CONTROLS
========================= */

document.addEventListener("keydown", function(e) {

  keys[e.key.toLowerCase()] = true;

  if (
    e.key === "ArrowLeft" ||
    e.key === "ArrowRight" ||
    e.key === "ArrowUp" ||
    e.key === "ArrowDown"
  ) {
    e.preventDefault();
  }

});

document.addEventListener("keyup", function(e) {
  keys[e.key.toLowerCase()] = false;
});


/* =========================
   UNLOCK
========================= */

function unlock() {

  const code = document.getElementById("code").value;

  if (code === "223605") {

    document.getElementById("codeScreen").style.display = "none";
    document.getElementById("game").style.display = "block";

    startGame();

  } else {

    document.getElementById("wrong").innerText =
      "Wrong code! Try again.";

  }

}


/* =========================
   START GAME
========================= */

function startGame() {

  playing = true;
  crashed = false;

  speed = 0.012;
  distance = 0;
  playerX = 0;

  objects = [];

  createObjects();

  requestAnimationFrame(gameLoop);
}


/* =========================
   CREATE ENDLESS OBJECTS
========================= */

function createObjects() {

  for (let i = 0; i < 35; i++) {

    objects.push({

      x: (Math.random() * 2 - 1) * 1.5,

      z: Math.random() * 3 + 0.2,

      type: Math.random() < 0.55
        ? "tree"
        : "rock"

    });

  }

}


/* =========================
   ADD NEW OBJECT
========================= */

function recycleObject(obj) {

  obj.z = 3.5;

  obj.x = (Math.random() * 2 - 1) * 1.5;

  obj.type =
    Math.random() < 0.55
      ? "tree"
      : "rock";

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

  if (!playing) return;

  update();

  draw();

  requestAnimationFrame(gameLoop);

}


/* =========================
   UPDATE
========================= */

function update() {

  if (crashed) return;


  /* Steering */

  if (keys["arrowleft"] || keys["a"]) {
    playerX -= 0.025;
  }

  if (keys["arrowright"] || keys["d"]) {
    playerX += 0.025;
  }


  playerX = Math.max(-1.3, Math.min(1.3, playerX));


  /* Speed */

  if (keys["arrowup"] || keys["w"]) {
    speed += 0.0003;
  } else {
    speed += 0.00005;
  }

  speed = Math.min(speed, 0.035);


  /* Distance */

  distance += speed * 100;


  /* Move objects */

  for (let obj of objects) {

    obj.z -= speed;

    if (obj.z < 0.05) {

      recycleObject(obj);

    }

    /* Collision */

    if (
      obj.z < 0.22 &&
      Math.abs(obj.x - playerX) < 0.18
    ) {

      crash();

    }

  }


  document.getElementById("speed").innerText =
    Math.round(speed * 3000);

  document.getElementById("distance").innerText =
    Math.floor(distance);

}


/* =========================
   DRAW EVERYTHING
========================= */

function draw() {

  /* Sky */

  const sky = ctx.createLinearGradient(
    0, 0,
    0, H
  );

  sky.addColorStop(0, "#62b8e8");
  sky.addColorStop(1, "#dff6ff");

  ctx.fillStyle = sky;

  ctx.fillRect(0, 0, W, H);


  /* Mountains */

  drawMountains();


  /* Snow track */

  drawTrack();


  /* Objects */

  let sorted = [...objects]
    .sort((a, b) => b.z - a.z);

  for (let obj of sorted) {

    drawObject(obj);

  }


  /* Player */

  drawPlayer();

}


/* =========================
   MOUNTAINS
========================= */

function drawMountains() {

  ctx.fillStyle = "#d9e8f2";

  ctx.beginPath();

  ctx.moveTo(0, H * 0.55);

  ctx.lineTo(W * 0.15, H * 0.28);
  ctx.lineTo(W * 0.3, H * 0.52);

  ctx.lineTo(W * 0.48, H * 0.22);
  ctx.lineTo(W * 0.65, H * 0.5);

  ctx.lineTo(W * 0.82, H * 0.25);
  ctx.lineTo(W, H * 0.52);

  ctx.lineTo(W, H);

  ctx.lineTo(0, H);

  ctx.closePath();

  ctx.fill();

}


/* =========================
   TRACK
========================= */

function drawTrack() {

  const horizon = H * 0.45;

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();

  ctx.moveTo(W * 0.46, horizon);
  ctx.lineTo(W * 0.54, horizon);

  ctx.lineTo(W * 0.95, H);
  ctx.lineTo(W * 0.05, H);

  ctx.closePath();

  ctx.fill();


  /* Track shadows */

  ctx.strokeStyle = "#d5e7ef";

  ctx.lineWidth = 4;

  for (let i = 0; i < 10; i++) {

    let y =
      horizon +
      Math.pow(i / 10, 2) *
      (H - horizon);

    let width =
      20 +
      i * 55;

    ctx.beginPath();

    ctx.moveTo(W / 2 - width, y);
    ctx.lineTo(W / 2 + width, y);

    ctx.stroke();

  }

}


/* =========================
   DRAW OBJECT
========================= */

function drawObject(obj) {

  const horizon = H * 0.45;

  let scale =
    1 / obj.z;

  let x =
    W / 2 +
    obj.x *
    W *
    0.35 *
    scale;

  let y =
    horizon +
    (1 / obj.z) *
    H *
    0.32;

  let size =
    55 * scale;


  if (obj.type === "tree") {

    /* Tree trunk */

    ctx.fillStyle = "#70452a";

    ctx.fillRect(
      x - size * 0.12,
      y - size * 0.8,
      size * 0.24,
      size
    );


    /* Snowy tree */

    ctx.fillStyle = "#27734b";

    ctx.beginPath();

    ctx.moveTo(x, y - size * 2);
    ctx.lineTo(x - size, y);
    ctx.lineTo(x + size, y);

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.moveTo(x, y - size * 2);
    ctx.lineTo(x - size * 0.5, y - size * 0.9);
    ctx.lineTo(x + size * 0.5, y - size * 0.9);

    ctx.closePath();

    ctx.fill();

  }


  if (obj.type === "rock") {

    ctx.fillStyle = "#777";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      size,
      size * 0.65,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

}


/* =========================
   PLAYER
========================= */

function drawPlayer() {

  const x = W / 2 + playerX * W * 0.22;

  const y = H * 0.82;


  /* Shadow */

  ctx.fillStyle = "rgba(0,0,0,0.2)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y + 25,
    45,
    10,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Board */

  ctx.fillStyle = "#d63c3c";

  ctx.fillRect(
    x - 55,
    y + 10,
    110,
    9
  );


  /* Body */

  ctx.fillStyle = "#2468d8";

  ctx.fillRect(
    x - 14,
    y - 35,
    28,
    45
  );


  /* Head */

  ctx.fillStyle = "#f2c7a5";

  ctx.beginPath();

  ctx.arc(
    x,
    y - 48,
    14,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Helmet */

  ctx.fillStyle = "#222";

  ctx.beginPath();

  ctx.arc(
    x,
    y - 53,
    15,
    Math.PI,
    Math.PI * 2
  );

  ctx.fill();

}


/* =========================
   CRASH
========================= */

function crash() {

  crashed = true;

  document.getElementById("message").style.display =
    "block";

}


/* =========================
   RESTART
========================= */

function restart() {

  document.getElementById("message").style.display =
    "none";

  startGame();

}

</script>

</body>
</html>
