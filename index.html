<!DOCTYPE html>
<html>
<head>
  <title>MathQuiz</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #46178f;
      color: white;
      text-align: center;
    }

    #codeScreen {
      padding-top: 100px;
    }

    input {
      padding: 15px;
      font-size: 20px;
      text-align: center;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 15px 30px;
      margin: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #game {
      display: none;
    }

    #topbar {
      background: #222;
      padding: 10px;
      font-size: 18px;
    }

    #world {
      position: relative;
      margin: auto;
      width: 900px;
      height: 500px;
      overflow: hidden;
      background: skyblue;
      border: 5px solid #222;
    }

    .block {
      position: absolute;
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border: 1px solid rgba(0,0,0,0.25);
    }

    .grass {
      background: #4caf50;
    }

    .dirt {
      background: #8b5a2b;
    }

    .stone {
      background: #777;
    }

    .wood {
      background: #9b6b3d;
    }

    .player {
      position: absolute;
      width: 30px;
      height: 45px;
      background: #2468d8;
      border: 3px solid #111;
      z-index: 10;
    }

    .mob {
      position: absolute;
      width: 32px;
      height: 38px;
      background: #55aa55;
      border: 3px solid #222;
      z-index: 9;
    }

    .shield {
      position: absolute;
      width: 18px;
      height: 30px;
      background: #aaa;
      border: 3px solid #333;
      z-index: 11;
      display: none;
    }

    #inventory {
      background: #222;
      padding: 10px;
      margin: auto;
      width: 870px;
    }

    .slot {
      display: inline-block;
      width: 55px;
      height: 55px;
      margin: 4px;
      background: #444;
      border: 2px solid #888;
      line-height: 55px;
      font-size: 24px;
    }

    #help {
      font-size: 15px;
    }
  </style>
</head>

<body>

<!-- CODE SCREEN -->
<div id="codeScreen">

  <h1>MathQuiz</h1>

  <h2>Enter Game Code</h2>

  <input id="code" placeholder="Game Code">

  <br>

  <button onclick="unlock()">ENTER</button>

  <p id="wrong"></p>

</div>


<!-- GAME -->
<div id="game">

  <div id="topbar">
    ❤️ Health: <span id="health">100</span>
    &nbsp;&nbsp;
    🛡️ Shield: <span id="shieldStatus">OFF</span>
    &nbsp;&nbsp;
    🧱 Blocks: <span id="blocks">10</span>
  </div>

  <h1>Block World</h1>

  <div id="world"></div>

  <div id="inventory">
    <b>🎒 Inventory</b><br>

    <div class="slot">🟩</div>
    <div class="slot">🟫</div>
    <div class="slot">⬜</div>
    <div class="slot">🪵</div>
  </div>

  <p id="help">
    WASD / Arrow Keys = Move |
    E = Shield |
    Click blocks = Mine
  </p>

</div>


<script>

const world = document.getElementById("world");

let playerX = 420;
let playerY = 300;

let health = 100;
let shieldOn = false;
let blockCount = 10;

const player = document.createElement("div");
player.className = "player";
world.appendChild(player);

const shield = document.createElement("div");
shield.className = "shield";
world.appendChild(shield);


// UNLOCK
function unlock() {

  const code = document.getElementById("code").value;

  if (code === "223605") {

    document.getElementById("codeScreen").style.display = "none";
    document.getElementById("game").style.display = "block";

    createWorld();
    createMob();

  } else {

    document.getElementById("wrong").innerText =
      "Wrong code! Try again.";

  }
}


// CREATE WORLD
function createWorld() {

  for (let y = 0; y < 10; y++) {

    for (let x = 0; x < 23; x++) {

      const block = document.createElement("div");

      block.className = "block";

      if (y === 7) {
        block.classList.add("grass");
      }

      else if (y > 7) {
        block.classList.add("dirt");
      }

      block.style.left = (x * 40) + "px";
      block.style.top = (y * 40 + 100) + "px";

      block.onclick = function() {

        block.remove();

        blockCount++;

        document.getElementById("blocks").innerText = blockCount;

      };

      world.appendChild(block);
    }
  }

  // Trees
  for (let i = 0; i < 4; i++) {

    let x = Math.floor(Math.random() * 20) * 40;

    for (let y = 4; y < 7; y++) {

      const wood = document.createElement("div");

      wood.className = "block wood";

      wood.style.left = x + "px";
      wood.style.top = (y * 40 + 100) + "px";

      wood.onclick = function() {
        wood.remove();
        blockCount++;
        document.getElementById("blocks").innerText = blockCount;
      };

      world.appendChild(wood);
    }
  }
}


// PLAYER MOVEMENT
document.addEventListener("keydown", function(e) {

  const speed = 10;

  if (e.key === "ArrowLeft" || e.key === "a") {
    playerX -= speed;
  }

  if (e.key === "ArrowRight" || e.key === "d") {
    playerX += speed;
  }

  if (e.key === "ArrowUp" || e.key === "w") {
    playerY -= speed;
  }

  if (e.key === "ArrowDown" || e.key === "s") {
    playerY += speed;
  }

  // Shield
  if (e.key.toLowerCase() === "e") {

    shieldOn = !shieldOn;

    shield.style.display =
      shieldOn ? "block" : "none";

    document.getElementById("shieldStatus").innerText =
      shieldOn ? "ON" : "OFF";
  }

  updatePlayer();

});


function updatePlayer() {

  playerX = Math.max(0, Math.min(870, playerX));
  playerY = Math.max(0, Math.min(450, playerY));

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";

  shield.style.left = (playerX + 30) + "px";
  shield.style.top = (playerY + 5) + "px";
}


// CREATE MOB
function createMob() {

  const mob = document.createElement("div");

  mob.className = "mob";

  mob.style.left = "700px";
  mob.style.top = "300px";

  world.appendChild(mob);

  setInterval(function() {

    let x = parseInt(mob.style.left);

    if (x > playerX) {
      x -= 3;
    } else {
      x += 3;
    }

    mob.style.left = x + "px";

    // Mob attack
    if (Math.abs(x - playerX) < 35) {

      if (!shieldOn) {

        health -= 5;

        document.getElementById("health").innerText =
          health;

        if (health <= 0) {

          alert("You were defeated!");

          location.reload();

        }

      }

    }

  }, 500);
}

</script>

</body>
</html>
