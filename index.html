<!DOCTYPE html>
<html>
<head>
  <title>MathQuiz</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #46178f;
      color: white;
      text-align: center;
    }

    #codeScreen {
      padding-top: 100px;
    }

    h1 {
      font-size: 50px;
    }

    input {
      padding: 15px;
      font-size: 20px;
      text-align: center;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 15px 30px;
      margin: 15px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #games {
      display: none;
      padding-top: 50px;
    }

    .game {
      display: inline-block;
      background: white;
      color: black;
      padding: 25px;
      margin: 10px;
      border-radius: 15px;
      width: 220px;
    }

    #gameArea {
      display: none;
      margin: 30px auto;
      width: 90%;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 15px;
      background: white;
    }
  </style>
</head>

<body>

  <!-- CODE SCREEN -->
  <div id="codeScreen">

    <h1>MathQuiz</h1>

    <h2>Enter Game Code</h2>

    <input id="code" placeholder="Game Code">

    <br>

    <button onclick="unlock()">ENTER</button>

    <p id="wrong"></p>

  </div>


  <!-- MAIN PAGE -->
  <div id="games">

    <h1>📚 MathQuiz</h1>

    <h2>Learning Resources</h2>

    <div class="game">
      <h2>📖 Study Tools</h2>

      <button onclick="openGame('https://eaglercraft1-8.github.io')">
        OPEN
      </button>
    </div>

    <div class="game">
      <h2>🧮 Math Practice</h2>

      <button onclick="openGame('https://snowrider-unblocked.github.io')">
        OPEN
      </button>
    </div>


    <!-- GAME WINDOW -->
    <div id="gameArea">

      <iframe id="gameFrame"></iframe>

    </div>

  </div>


  <script>

    function unlock() {

      var code = document.getElementById("code").value;

      if (code === "223605") {

        document.getElementById("codeScreen").style.display = "none";

        document.getElementById("games").style.display = "block";

      } else {

        document.getElementById("wrong").innerText =
          "Wrong code! Try again.";

      }

    }


    function openGame(url) {

      document.getElementById("gameArea").style.display = "block";

      document.getElementById("gameFrame").src = url;

    }

  </script>

</body>
</html>
